[project]
name = "blockpilot"
version = "0.1.0"
description = "Next-block prediction for Minecraft builds, trained on 3D-Craft"
requires-python = ">=3.13"
dependencies = ["torch", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockpilot"]
